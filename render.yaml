services:
  - type: web
    name: bookleaf-api
    env: node
    plan: free
    region: frankfurt
    buildCommand: npm install && npm run prisma:generate && npm run build:api
    startCommand: node apps/api/dist/src/main
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: COOKIE_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: AI_PROVIDER
        value: gemini
      - key: AI_MODEL
        value: gemini-3.5-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGIN
        value: https://*.vercel.app
